name: frame_audio_clip
description: "Record streamed audio clips from the Brilliant Labs Frame into a list for review and playback"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  brilliant_ble:
    path: ../../../brilliant_ble
  brilliant_msg:
    path: ../../../brilliant_msg
  logging: ^1.2.0
  flutter_sound: ^9.28.0
  share_plus: ^10.1.0
  simple_brilliant_app:
    # Note: We use a path dependency because the example apps & library packages are bundled together.
    # In *your* app you should use a versioned dependency from pub.dev
    path: ../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
  - packages/brilliant_msg/lua/battery.min.lua
  - packages/brilliant_msg/lua/data.min.lua
  - packages/brilliant_msg/lua/code.min.lua
  - packages/brilliant_msg/lua/plain_text.min.lua
  - assets/frame_app.lua
