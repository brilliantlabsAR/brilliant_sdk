name: vision_api
description: "Captures an image from Brilliant Labs Halo and Frame and sends it to a user-specified API for processing"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.5
  flutter_foreground_task: ^6.5.0
  http: ^1.2.2
  http_parser: ^4.0.2
  image: ^4.3.0
  logging: ^1.3.0
  share_plus: ^10.1.0
  shared_preferences: ^2.3.2
  simple_brilliant_app:
    # Note: We use a path dependency because the example apps & library packages are bundled together.
    # In *your* app you should use a versioned dependency from pub.dev
    path: ../../
  brilliant_ble:
    path: ../../../brilliant_ble
  brilliant_msg:
    path: ../../../brilliant_msg

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - packages/brilliant_msg/lua/battery.min.lua
    - packages/brilliant_msg/lua/camera.min.lua
    - packages/brilliant_msg/lua/code.min.lua
    - packages/brilliant_msg/lua/data.min.lua
    - packages/brilliant_msg/lua/plain_text.min.lua
    - assets/frame_app.lua
