name: ancs_notifications
description: "Brilliant Labs Halo ANCS (iOS Notifications) Demo App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.33.6
  logging: ^1.3.0
  # Note: We use a path dependency because the example apps & library packages are bundled together.
  # In *your* app you should use a versioned dependency from pub.dev
  simple_brilliant_app:
    path: ../../
  brilliant_msg:
    path: ../../../brilliant_msg

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - packages/brilliant_msg/lua/battery.min.lua
    - packages/brilliant_msg/lua/code.min.lua
    - packages/brilliant_msg/lua/data.min.lua
    - assets/frame_app.lua
