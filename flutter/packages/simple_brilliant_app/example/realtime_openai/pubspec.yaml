name: realtime_openai
description: "Realtime voice conversations with the OpenAI Realtime API (or any OpenAI-compatible backend) on Brilliant Labs Halo, using LC3 audio in both directions"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  brilliant_ble:
    path: ../../../brilliant_ble
  brilliant_msg:
    path: ../../../brilliant_msg
  logging: ^1.2.0
  shared_preferences: ^2.3.2
  simple_brilliant_app:
    # Note: We use a path dependency because the example apps & library packages are bundled together.
    # In *your* app you should use a versioned dependency from pub.dev
    path: ../../
  ffi: ^2.1.4
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.21.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
  - packages/brilliant_msg/lua/battery.min.lua
  - packages/brilliant_msg/lua/data.min.lua
  - packages/brilliant_msg/lua/code.min.lua
  - packages/brilliant_msg/lua/plain_text.min.lua
  - assets/frame_app.lua
