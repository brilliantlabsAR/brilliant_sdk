[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brilliant-msg"
version = "7.0.0"
dependencies = [
    "lz4>=4.4.3,<5.0.0",
    "numpy>=2.2.3,<3.0.0",
    "pillow>=11.1.0,<12.0.0",
    "brilliant-ble>=3.0.0"
]
authors = [
    { name = "luke-brilliant" },
]
description = "Handles various message types for Brilliant Labs Frame and Halo devices"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
tests = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pvspeaker>=1.0.0",
    "opencv-python>=4.0.0",
    "qoi>=0.7.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
examples = [
    "websockets>=13.0",
    "lc3py>=1.1.3",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/brilliant_msg"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[project.urls]
"Homepage" = "https://github.com/brilliantlabsAR/brilliant_sdk/tree/main/python/packages/brilliant_msg"
"Bug Tracker" = "https://github.com/brilliantlabsAR/brilliant_sdk/issues"
"Changelog" = "https://github.com/brilliantlabsAR/brilliant_sdk/blob/main/python/packages/brilliant_msg/CHANGELOG.md"
