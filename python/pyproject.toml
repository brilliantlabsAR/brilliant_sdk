[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.workspace]
members = [
    "packages/frame_ble",
    "packages/frame_msg",
    "packages/halo_emulator",
]

[tool.uv.sources]
frame-ble = { workspace = true }
frame-msg = { workspace = true }
