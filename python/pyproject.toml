[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "device: requires a physical Brilliant device connected over BLE (opt in with BRILLIANT_DEVICE=1)",
]

[tool.uv.workspace]
members = [
    "packages/brilliant_ble",
    "packages/brilliant_msg",
    "packages/brilliant_sdk",
    "packages/halo_emulator",
]

[tool.uv.sources]
brilliant-ble = { workspace = true }
brilliant-msg = { workspace = true }
